<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的HTML文件</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
}

body{
background:#111;
color:white;
padding:20px;
}

h1{
font-size:30px;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
font-size:18px;
border-radius:12px;
border:none;
outline:none;
margin-bottom:20px;
background:#222;
color:white;
}

#list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.card{

background:#1d1d1d;

border-radius:15px;

padding:18px;

transition:.25s;

cursor:pointer;

}

.card:hover{

transform:translateY(-4px);

background:#2a2a2a;

}

.title{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

word-break:break-all;

}

.url{

font-size:12px;

color:#999;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}

.loading{

text-align:center;

margin-top:60px;

font-size:18px;

color:#888;

}

</style>

</head>

<body>

<h1>📁 HTML 文件</h1>

<input id="search" placeholder="搜尋HTML">

<div id="list">

<div class="loading">

讀取中...

</div>

</div>

<script>

const USER="fam3000";

const REPO="mb";

const BASE=`https://${USER}.github.io/${REPO}/`;

let htmlFiles=[];

async function load(){

const api=`https://api.github.com/repos/${USER}/${REPO}/contents/`;

const r=await fetch(api);

const data=await r.json();

htmlFiles=data.filter(x=>

x.type==="file"

&&x.name.endsWith(".html")

&&x.name!="index.html"

);

render(htmlFiles);

}

function render(arr){

const list=document.getElementById("list");

list.innerHTML="";

arr.forEach(file=>{

const card=document.createElement("div");

card.className="card";

card.onclick=()=>{

location.href=BASE+file.name;

};

card.innerHTML=`

<div class="title">

📄 ${file.name.replace(".html","")}

</div>

<div class="url">

${BASE+file.name}

</div>

`;

list.appendChild(card);

});

if(arr.length==0){

list.innerHTML="<div class='loading'>沒有找到HTML</div>";

}

}

document.getElementById("search").oninput=function(){

const k=this.value.toLowerCase();

render(

htmlFiles.filter(x=>

x.name.toLowerCase().includes(k)

)

);

};

load();

</script>

</body>
</html>
